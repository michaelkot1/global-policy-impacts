# Interstate programs. See federal.yaml for conventions.
#
# `jurisdiction: US` on an interstate program means "no single issuing state";
# the United States is the nearest enclosing jurisdiction in the database. Who
# the program binds is recorded in `applicability`.

policies:

  - slug: rggi
    title: Regional Greenhouse Gas Initiative (RGGI)
    kind: interstate_program
    level: interstate
    jurisdiction: US
    enacted: 2005-12-20
    effective: 2009-01-01
    status: enacted
    summary: >
      Northeast and Mid-Atlantic cap-and-trade program for CO2 from fossil power
      plants of 25 MW or more. The MOU was signed 2005-12-20 by seven states
      (CT, DE, ME, NH, NJ, NY, VT); MD, MA and RI joined in 2007. The first
      compliance period began 2009-01-01 for all ten. New Jersey withdrew
      effective 2012-01-01 and resumed 2020-01-01. Virginia participated 2021
      through 2023 and resumed 2026-07-01. Pennsylvania adopted a rule that was
      enjoined in 2022, never became an active participant, and removed itself
      from the program in a November 2025 budget law, so it has no applicability
      rows.
    url: https://www.rggi.org/program-overview-and-design/design-archive
    citations:
      - rggi_design_archive
      - rggi_new_participation
      - rggi_nj_participation
      - crs_r41836_rggi
    applicability:
      - jurisdictions: [CT, DE, ME, MD, MA, NH, NY, RI, VT]
        start: 2009-01-01
        notes: First compliance period; participation continuous through 2026-10-28.
      - jurisdictions: [NJ]
        start: 2009-01-01
        end: 2011-12-31
        notes: Governor Christie announced withdrawal in May 2011; MOU withdrawal effective 2012-01-01. Allowances issued earlier remained valid for compliance.
      - jurisdictions: [NJ]
        start: 2020-01-01
        notes: Rejoined after a June 2019 rule.
      - jurisdictions: [VA]
        start: 2021-01-01
        end: 2023-12-31
        notes: First participation period.
      - jurisdictions: [VA]
        start: 2026-07-01
        notes: Resumed participation, with a 2026 allowance budget for the second half of the year.
    effects:
      - metric: co2
        direction: decrease
        tier: A
        scope: electric-power-sector CO2, RGGI states (counterfactual effect after 2009)
        estimate: -19.4
        unit: percent
        method: >
          Panel regression of power-sector CO2 for the 48 contiguous states,
          1991-2012, with counterfactual simulation (Murray and Maniloff 2015).
          The paper reports that emissions would have been 24% higher without
          RGGI; the percent change shown is derived as 1/1.24 - 1 = -19.4% and
          has no published confidence interval here.
        mechanism: >
          A declining CO2 cap on power plants raises the cost of coal and gas
          generation relative to cleaner sources, and auction proceeds fund
          efficiency and clean energy. Independent estimates of the net effect
          vary: Yan (2021) finds 4.8 million tons per year lower emissions in
          regulated states, 3.5 million tons higher in neighbouring states
          (leakage), and a net reduction of 1.3 million tons per year; Fell and
          Maniloff (2018) and Chan and Morrow (2019) also find leakage and
          co-pollutant effects. Other factors (natural gas prices, the 2008
          recession, other state policies) also lowered emissions in the region.
        citations: [murray_maniloff_2015, yan_2021, fell_maniloff_2018, chan_morrow_2019]
