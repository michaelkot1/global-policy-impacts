# Registry of citations referenced by the policy catalog (by key).
#
# Fields
#   title          required
#   source         required; key in _sources.yaml (the publisher / host)
#   authors        optional, free text
#   year           optional
#   doi            optional; every DOI here was checked against Crossref
#   url            optional but expected when there is no DOI
#   peer_reviewed  optional (default false); evidence tier A requires at least one
#                  peer_reviewed citation with a DOI
#   accessed       optional ISO date on which the URL was last checked and found to
#                  resolve (and, for pages used as the basis of a date or number,
#                  read). Left out where a site blocks automated access and the
#                  page was not checked.

