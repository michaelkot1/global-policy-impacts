[project]
name = "policy-pipeline"
version = "0.1.0"
description = "Data pipeline for the Policy Impact Explorer: fetches emissions, population and GDP data, loads policy records, runs event-study estimates, and builds the SQLite database."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "linearmodels>=6.1",
    "statsmodels>=0.14",
]

[project.scripts]
build-db = "build_db:main"
